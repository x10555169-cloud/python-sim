# 每次 push 到 main：GitHub 執行 Python（讀 Excel → 分析）→ 把結果和網頁一起發佈到 GitHub Pages
# 2026/11 更新：actions 換新版；上傳＋發佈用 GitHub 官方範本的組合（upload v3 + deploy v5）
# 2026/11/25：不用 Render 也能跑——simulation.py 一起發佈到網頁，由瀏覽器裡的 Python 執行
name: Run Python and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:      # 也可以在 Actions 頁面手動按 Run workflow
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - name: Arrange folders (若檔案被上傳在最外層，自動放回 backend/ 與 frontend/)
        run: |
          if [ ! -d backend ]; then
            mkdir -p backend/data frontend/data
            cp *.py requirements.txt backend/
            cp *.xlsx backend/data/ie_chair_data.xlsx
            cp index.html style.css app.js config.js frontend/
            [ -f docs.html ] && cp docs.html frontend/ || true
            [ -f browser_engine.js ] && cp browser_engine.js frontend/ || true
            [ -f api.html ] && cp api.html frontend/ || true
          fi
          # 瀏覽器模式：網頁要讀同一個 simulation.py（Python 在瀏覽器裡執行，不用 Render）
          cp backend/simulation.py frontend/simulation.py
          ls -R backend frontend
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install packages
        run: pip install openpyxl
      - name: Run Python (目標一、二)
        working-directory: backend
        run: python build_static.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3   # 同 GitHub 官方範本（v5 目前跟 deploy-pages@v5 不相容）
        with: { path: frontend }
      - id: deploy
        uses: actions/deploy-pages@v5
