<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python 課堂模擬</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Python 課堂模擬</h1>
    <div id="conn" class="pill">連線中…</div>
  </header>
  <nav class="topnav" aria-label="相關連結">
    <a href="./" aria-current="page">前端網頁</a>
    <a id="lnkBackend" href="#" target="_blank" rel="noopener">後端首頁</a>
    <a id="lnkApiDocs" href="#" target="_blank" rel="noopener">API 文件</a>
    <a href="api.html">老師 API Dashboard</a>
    <a href="docs.html" target="_blank" rel="noopener">系統說明</a>
    <a id="lnkRepo" href="https://github.com/x10555169-cloud/python-sim" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <main>
    <section class="card" id="controlCard">
      <h2>模擬控制</h2>
      <div class="row">
        <button id="btnStart" class="primary">開始模擬</button>
        <button id="btnPause">暫停模擬</button>
        <button id="btnResume" class="primary">繼續模擬</button>
        <button id="btnStop">停止模擬</button>
        <input id="token" type="password" placeholder="管理密碼（若有設定）" autocomplete="off">
      </div>
      <dl class="stats">
        <div><dt>狀態</dt><dd id="stRunning">—</dd></div>
        <div><dt>執行次數</dt><dd id="stTick">—</dd></div>
        <div><dt>Run ID</dt><dd id="stRun">—</dd></div>
        <div><dt>資料來源</dt><dd id="stSource">—</dd></div>
      </dl>
      <p class="hint" id="apiMsg"></p>
    </section>

    <section class="card groupbar">
      <label for="groupSel">選擇組別</label>
      <select id="groupSel"></select>
      <label for="batchSel">選擇場次</label>
      <select id="batchSel"></select>
      <span class="hint" id="groupInfo"></span>
      <span class="teacher-links" id="teacherLinks"></span>
    </section>

    <section class="card">
      <h2>Python 最新訊息</h2>
      <p id="latest" class="latest">等待 Python 送出資料…</p>
      <p class="hint" id="genAt"></p>
      <dl class="stats" id="latestStats"></dl>
    </section>
    <section class="card">
      <h2><span id="linesTitle">各組生產線分析</span> <span class="sub">（產線 Cycle Time = 總耗時 ÷ 終點站產出組數，老師監控中心橫幅稱為「節拍時間」；各站為工站平均 CT，<mark>標色</mark> = 瓶頸站）</span></h2>
      <div class="table-wrap"><table id="lines"></table></div>
      <div id="stationBox" hidden>
        <h3 id="stationTitle"></h3>
        <div class="table-wrap"><table id="stationTable"></table></div>
        <p class="hint" id="stationNote"></p>
      </div>
    </section>

    <section class="card" id="roundCard">
      <h2>場次紀錄 <span class="sub" id="roundSub"></span></h2>
      <p class="hint" id="roundHint"></p>
      <div class="table-wrap"><table id="roundTable"></table></div>
      <div class="row round-actions">
        <button id="btnSaveRounds" class="primary">儲存到資料庫</button>
        <button id="btnResetRounds">取消修改</button>
        <span class="hint" id="roundMsg" role="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>結果紀錄</h2>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="browser_engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
