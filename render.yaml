# Render Blueprint（也可以照 README 用 New → Web Service 手動建立）
services:
  - type: web
    name: python-sim-api
    runtime: python
    plan: free
    # 檔案有 backend/ 資料夾或全部放在最外層都能用
    buildCommand: pip install -r requirements.txt 2>/dev/null || pip install -r backend/requirements.txt
    startCommand: cd backend 2>/dev/null; uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SIM_INTERVAL_SECONDS
        value: "5"
      - key: MAX_RUN_MINUTES
        value: "90"
