# Render Blueprint：在 Render 後台 New → Blueprint，選這個 repo 即可
services:
  - type: web
    name: python-sim-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SIM_INTERVAL_SECONDS
        value: "5"
      - key: MAX_RUN_MINUTES
        value: "90"
